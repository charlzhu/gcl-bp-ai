[alembic]
# 使用 %(here)s 保证从项目根目录或 backend 目录执行都能定位到脚本目录。
script_location = %(here)s/alembic

# 默认不把数据库连接串写死在仓库里。
# 运行时优先级：
# 1. 环境变量 ALEMBIC_DATABASE_URL
# 2. 本项 sqlalchemy.url
# 3. backend.app.core.config.settings.mysql_dsn
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
level = INFO
handlers = console
qualname = alembic
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
