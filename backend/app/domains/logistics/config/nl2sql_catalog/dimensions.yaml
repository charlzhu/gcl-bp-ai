catalog_version: logistics_nl2sql_catalog.v1
domain: logistics
dimensions:
  - dimension_id: biz_year
    display_name: 年份
    aliases: [年份, 年, 年度]
    column: biz_year
    table: dws_logistics_detail_union
    business_note: 默认时间范围由规则目录控制，显式年份直接过滤 biz_year。
  - dimension_id: biz_month
    display_name: 年月
    aliases: [月份, 月, 年月, 月度]
    column: biz_month
    table: dws_logistics_detail_union
    business_note: 月度趋势、月度对比使用 biz_month。
  - dimension_id: logistics_company_name
    display_name: 承运商
    aliases: [承运商, 物流公司, 物流, 物流供应商]
    column: logistics_company_name
    table: dws_logistics_detail_union
    business_note: “哪个物流跑得最多”按该维度分组。
  - dimension_id: region_name
    display_name: 区域
    aliases: [区域, 片区, 各区域, 分区域]
    column: region_name
    table: dws_logistics_detail_union
  - dimension_id: customer_name
    display_name: 客户
    aliases: [客户, 客户名称]
    column: customer_name
    table: dws_logistics_detail_union
  - dimension_id: origin_place
    display_name: 始发地
    aliases: [始发地, 起运地, 从哪里发, 发出地]
    column: origin_place
    table: dws_logistics_detail_union
  - dimension_id: city
    display_name: 目的城市
    aliases: [城市, 目的城市, 到达城市]
    column: city
    table: dwd_logistics_hist_shipment_detail
  - dimension_id: transport_mode
    display_name: 运输方式
    aliases: [运输方式, 水路, 陆运, 铁路]
    column: transport_mode
    table: dws_logistics_detail_union
