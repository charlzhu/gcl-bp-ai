      - {name: parse_status, data_type: varchar, business_name: 解析状态, semantic_role: dimension, nullable: false}
      - {name: sheet_count, data_type: int, business_name: 总 sheet 数, semantic_role: metric, nullable: false}
      - {name: model_sheet_count, data_type: int, business_name: 有效模型页数, semantic_role: metric, nullable: false}
      - {name: warning_count, data_type: int, business_name: 警告数, semantic_role: metric, nullable: false}
