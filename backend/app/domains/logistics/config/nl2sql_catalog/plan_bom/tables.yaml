catalog_version: plan_bom_nl2sql_catalog.v1
domain: plan_bom
tables:
  - table_name: plan_bom_header
    display_name: BOM 头表
    domain: plan_bom
    source_system: middle_db
    allowed_read: true
    grain: 每个 BOM 实例 + 版本 + 来源一条记录
    columns:
      - {name: id, data_type: bigint, business_name: 技术主键, semantic_role: trace, nullable: false}
      - {name: order_no, data_type: varchar, business_name: 订单/评审号, semantic_role: dimension, nullable: false}
      - {name: version_no, data_type: varchar, business_name: 版本号, semantic_role: dimension, nullable: false}
      - {name: order_identity_key, data_type: varchar, business_name: 内部实例键, semantic_role: trace, nullable: false}
      - {name: file_instance_key, data_type: varchar, business_name: 文件实例键, semantic_role: trace, nullable: false}
      - {name: file_no, data_type: varchar, business_name: BOM 文件号, semantic_role: dimension, nullable: true}
      - {name: order_name, data_type: varchar, business_name: 订单/评审号名称, semantic_role: dimension, nullable: true}
      - {name: effective_date, data_type: date, business_name: 生效日期, semantic_role: time, nullable: true}
      - {name: source_type, data_type: varchar, business_name: 来源类型, semantic_role: dimension, nullable: false}
      - {name: source_tag, data_type: varchar, business_name: 来源标记, semantic_role: dimension, nullable: false}
      - {name: import_batch_id, data_type: varchar, business_name: 导入批次号, semantic_role: trace, nullable: false}
      - {name: raw_file_name, data_type: varchar, business_name: 原始文件名, semantic_role: trace, nullable: true}
      - {name: raw_sheet_name, data_type: varchar, business_name: 原始 Sheet 名, semantic_role: trace, nullable: true}
      - {name: is_active, data_type: smallint, business_name: 是否有效, semantic_role: rule_filter, nullable: false}
      - {name: created_at, data_type: datetime, business_name: 创建时间, semantic_role: trace, nullable: false}
      - {name: updated_at, data_type: datetime, business_name: 更新时间, semantic_role: trace, nullable: false}
  - table_name: plan_bom_material_line
    display_name: BOM 材料明细表
    domain: plan_bom
    source_system: middle_db
    allowed_read: true
    grain: 每个 BOM 实例 + 版本 + SAP 编码一条记录
    columns:
      - {name: id, data_type: bigint, business_name: 技术主键, semantic_role: trace, nullable: false}
      - {name: order_no, data_type: varchar, business_name: 订单/评审号, semantic_role: dimension, nullable: false}
      - {name: version_no, data_type: varchar, business_name: 版本号, semantic_role: dimension, nullable: false}
      - {name: sap_code, data_type: varchar, business_name: SAP 编码, semantic_role: dimension, nullable: false}
      - {name: line_no, data_type: varchar, business_name: 行号, semantic_role: trace, nullable: true}
      - {name: material_name, data_type: varchar, business_name: 物料名称, semantic_role: dimension, nullable: false}
      - {name: material_category, data_type: varchar, business_name: 物料归类, semantic_role: dimension, nullable: true}
      - {name: description, data_type: text, business_name: 规格描述, semantic_role: dimension, nullable: true}
      - {name: standard_usage, data_type: decimal, business_name: 标准用量, semantic_role: metric, nullable: true}
      - {name: unit, data_type: varchar, business_name: 单位, semantic_role: dimension, nullable: true}
      - {name: production_loss, data_type: varchar, business_name: 生产损耗, semantic_role: dimension, nullable: true}
      - {name: remark, data_type: text, business_name: 备注, semantic_role: trace, nullable: true}
      - {name: replacement_marker, data_type: varchar, business_name: 替代标识, semantic_role: dimension, nullable: true}
      - {name: source_type, data_type: varchar, business_name: 来源类型, semantic_role: dimension, nullable: false}
      - {name: source_tag, data_type: varchar, business_name: 来源标记, semantic_role: dimension, nullable: false}
      - {name: import_batch_id, data_type: varchar, business_name: 导入批次号, semantic_role: trace, nullable: false}
